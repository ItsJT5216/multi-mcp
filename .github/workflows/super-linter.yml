name: Lint Code Base

on:
  pull_request:

jobs:
  run-lint:
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter@v9
        env:
          VALIDATE_ALL_CODEBASE: false
          MULTI_STATUS: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
