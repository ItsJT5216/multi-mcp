name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv==0.12.21
        uv sync --locked --extra test --python "${{ matrix.python-version }}"
    - name: Analysing the code with pylint
      run: |
        mapfile -d '' -t python_files < <(git ls-files -z '*.py')
        uv run --frozen --extra test --python "${{ matrix.python-version }}" --with pylint==4.0.8 pylint "${python_files[@]}"
