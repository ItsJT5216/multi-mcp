# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# lintr provides static code analysis for R.
# It checks for adherence to a given style,
# identifying syntax errors and possible semantic issues,
# then reports them to you so you can take action.
# More details at https://lintr.r-lib.org/

name: lintr

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '42 0 * * 6'

permissions:
  contents: read

jobs:
  lintr:
    name: Run lintr scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read # for checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6

      - name: Setup lintr
        uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          extra-packages: |
            any::lintr
            any::jsonlite

      - name: Run lintr
        id: lintr
        run: |
          # Match the documented lint_dir() formats for discovery and scanning.
          source_pattern <- "(?i)[.](r|rmd|qmd|rnw|rhtml|rrst|rtex|rtxt)$"
          source_files <- list.files(".", pattern = source_pattern, recursive = TRUE, full.names = TRUE)
          lints <- lintr::lint_dir(".", pattern = source_pattern)
          if (length(source_files) == 0L) {
            message("not applicable: no recognized R source files")
            cat("not applicable: no recognized R source files\n",
                file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
            cat("applicable=false\n", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          } else {
            lintr::sarif_output(lints, filename = "lintr-results.sarif")
            cat("applicable=true\n", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          }
        shell: Rscript {0}

      - name: Upload analysis results to GitHub
        if: steps.lintr.outputs.applicable == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: lintr-results.sarif
          wait-for-processing: true
