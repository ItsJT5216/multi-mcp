apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-mcp
  template:
    metadata:
      labels:
        app: multi-mcp
    spec:
      containers:
      - name: multi-mcp
        image: multi-mcp:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: MULTI_MCP_API_KEY
          valueFrom:
            secretKeyRef:
              name: multi-mcp-auth
              key: api-key
        ports:
        - containerPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: multi-mcp-service
spec:
  # Keep the service off public node interfaces. Use a
  # TLS-terminating, access-controlled ingress when external access is needed.
  type: ClusterIP
  selector:
    app: multi-mcp
  ports:
  - port: 8083
    targetPort: 8083
